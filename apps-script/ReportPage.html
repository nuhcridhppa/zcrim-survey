<!DOCTYPE html>
<html>
<head>
<base target="_blank">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --label:#1D1D1F; --label2:#6E6E73; --label3:#86868B; --bg:#F5F5F7; --card:#FFFFFF; --hair:#E5E5EA;
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --blueT:#E5F1FF; --greenT:#E8F8EC; --orangeT:#FFF4E5; --redT:#FFECEB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--label);font-size:12.5px;line-height:1.45;letter-spacing:-.01em;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}

/* ── Search toolbar (not printed) ── */
.toolbar{position:sticky;top:0;z-index:5;background:rgba(245,245,247,.92);backdrop-filter:blur(12px);padding:12px 18px;border-bottom:1px solid var(--hair);display:flex;gap:8px;align-items:center}
.toolbar input{flex:1;padding:9px 14px;border:1px solid #D2D2D7;border-radius:10px;background:#fff;outline:none}
.toolbar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.tb{padding:9px 16px;border-radius:10px;border:0;font-weight:600;cursor:pointer}
.tb.primary{background:var(--blue);color:#fff}
.tb.ghost{background:#E8E8ED;color:var(--label)}
.tb:disabled{opacity:.4;cursor:default}
#results{padding:6px 18px 0}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 14px;margin:6px 0;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.res:hover{box-shadow:0 0 0 2px var(--blue)}
.res .sub{color:var(--label3);font-size:11.5px}
.msg{padding:30px;text-align:center;color:var(--label3)}

/* ── Report ── */
.page{max-width:820px;margin:18px auto 40px;padding:0 18px}
.eyebrow{font-size:11px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.08em}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:4px 0 2px;line-height:1.1}
.meta{color:var(--label2);font-size:12.5px}
.hero{display:flex;justify-content:space-between;gap:16px}
.hero .right{text-align:right;min-width:200px}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-green{background:var(--greenT);color:#1E7B34}.p-orange{background:var(--orangeT);color:#B25E00}
.p-red{background:var(--redT);color:#C4261D}.p-blue{background:var(--blueT);color:#0058B9}.p-gray{background:#EDEDF0;color:var(--label2)}
.small{font-size:11px;color:var(--label3);line-height:1.6}
.card{background:var(--card);border-radius:16px;padding:18px 20px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);break-inside:avoid}
.card h2{font-size:15px;font-weight:700;margin:0 0 10px;letter-spacing:-.015em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
.stat .n{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.stat .n small{font-size:13px;color:var(--label3)}
.stat .s{font-size:11px;color:var(--label2)}
.flag{padding:9px 0;border-top:1px solid #F0F0F3;font-size:12.5px}
.flag:first-of-type{border-top:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;vertical-align:1px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ph .img{height:150px;border-radius:12px;background:#EDEDF0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--label3);font-size:11px;text-align:center;padding:8px}
.ph .img.miss{background:#fff;border:1.5px dashed #D2D2D7}
.ph .img.req{border-color:var(--red);color:var(--red)}
.ph .c{font-size:11.5px;font-weight:600;margin-top:6px}
.ph .m{font-size:10.5px;color:var(--label3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .card{margin-top:14px}
.list{width:100%;border-collapse:collapse}
.list td{padding:8px 0;border-top:1px solid #F0F0F3;font-size:12.5px}
.list tr:first-child td{border-top:0}
.list td.k{color:var(--label2);width:46%}
.list td.v{font-weight:500;text-align:right}
.meter{height:8px;border-radius:99px;background:#EDEDF0;overflow:hidden;margin:2px 0 12px}
.meter div{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--orange),#FFB340)}
.mem{width:100%;border-collapse:collapse}
.mem th{font-size:10.5px;color:var(--label3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:0 8px 8px 0;border-bottom:1px solid #D2D2D7}
.mem td{padding:10px 8px 10px 0;border-bottom:1px solid #F0F0F3;font-size:12.5px;vertical-align:middle}
.mem tr:last-child td{border-bottom:0}
.mem .r{text-align:right}
.av{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--blueT);color:var(--blue);font-weight:700;font-size:11px;text-align:center;line-height:26px;margin-right:8px;vertical-align:middle}
.sub{color:var(--label3);font-size:11px}
.sign{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:20px;margin-top:40px}
.sign div{border-top:1px solid var(--label);padding-top:5px;font-size:11px;color:var(--label2)}
.foot{margin-top:22px;text-align:center;color:var(--label3);font-size:10.5px}
a{color:var(--blue);text-decoration:none}

@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.two,.photos{grid-template-columns:1fr 1fr}.hero{flex-direction:column}.hero .right{text-align:left}}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;font-size:11.5px}
  .toolbar,#results{display:none!important}
  .page{margin:0;max-width:none;padding:0}
  .card,.stat{box-shadow:none;border:1px solid var(--hair)}
  .card{padding:12px 16px;margin-top:10px;border-radius:12px}
  .card h2{font-size:13.5px;margin-bottom:6px}
  .stats{margin-top:14px;gap:10px}
  .stat{padding:10px 12px;border-radius:12px}
  .glance{columns:2;column-gap:24px}
  .flag{padding:5px 0;break-inside:avoid;border-top:0}
  .photos{gap:8px}
  .ph .img{height:110px;border-radius:8px}
  .list td{padding:5px 0}
  .mem td{padding:6px 8px 6px 0}
  .sign{margin-top:28px}
  .keep{break-inside:avoid}
  h1{font-size:26px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="toolbar">
  <input id="q" placeholder="Search Family ID or name…  (Enter)" autofocus>
  <button class="tb ghost" onclick="search()">Search</button>
  <button class="tb primary" id="btn-print" onclick="window.print()" disabled>🖨️ Print / Save PDF</button>
</div>
<div id="results"><div class="msg">Loading latest surveys…</div></div>
<div id="report"></div>

<script>
var PHOTOS = [
  ['front',          'House front',          true],
  ['surroundings',   'Surroundings',         true],
  ['surveyorFamily', 'Surveyor with family', true],
  ['selfie',         'Surveyor selfie',      true],
  ['familyPhoto',    'With family members',  false],
  ['kitchen',        'Kitchen',              false]
];

function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function present(v){ v=String(v||'').trim(); return v!=='' && !/^(no|nil|nill|none|na|n\/a|0|-|—)$/i.test(v); }
function inr(n){ return n>=100000 ? '₹'+(n/100000).toFixed(n%100000?2:0).replace(/\.?0+$/,'')+'L' : '₹'+Number(n).toLocaleString('en-IN'); }
function range(r){                       // "50,000 - 75,000" → [50000,75000]; "Above 10,00,000" → [1000000,null]
  var n=String(r||'').match(/[\d,]+/g); if(!n) return null;
  n=n.map(function(x){return +x.replace(/,/g,'');});
  return /above/i.test(r) ? [n[0],null] : [n[0], n[1]!=null?n[1]:n[0]];
}
function km(a,b){                        // haversine, metres
  var R=6371000, t=Math.PI/180, dLa=(b[0]-a[0])*t, dLo=(b[1]-a[1])*t;
  var h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
// Same brackets as the survey app's Income Range list
var BRACKETS = ['0 - 5,000','5,000 - 10,000','10,000 - 25,000','25,000 - 50,000','50,000 - 75,000','75,000 - 1,00,000',
  '1,00,000 - 1,40,000','1,40,000 - 1,80,000','1,80,000 - 3,00,000','3,00,000 - 5,00,000','5,00,000 - 6,00,000',
  '6,00,000 - 7,00,000','7,00,000 - 8,00,000','8,00,000 - 9,00,000','9,00,000 - 10,00,000','Above 10,00,000'];
// Verified family income: add up the LOWER end of every member's range, then take the bracket that total falls in.
// e.g. 25,000–50,000 + 75,000–1,00,000 → 25,000 + 75,000 = 1,00,000 → bracket 1,00,000 – 1,40,000
function familyBracket(total){
  for (var i=BRACKETS.length-1; i>=0; i--){ if (total >= range(BRACKETS[i])[0]) return BRACKETS[i]; }
  return BRACKETS[0];
}
function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }

// ── Search ──
document.getElementById('q').addEventListener('keydown',function(e){ if(e.key==='Enter') search(); });
function search(){
  var q=document.getElementById('q').value;
  document.getElementById('results').innerHTML='<div class="msg">Searching…</div>';
  google.script.run.withSuccessHandler(showResults).withFailureHandler(fail).rv2Search(q);
}
function showResults(list){
  var el=document.getElementById('results');
  if(!list.length){ el.innerHTML='<div class="msg">No surveys found.</div>'; return; }
  if(list.length===1 && document.getElementById('q').value.trim()){ openReport(list[0].row); return; }
  el.innerHTML = list.map(function(r){
    return '<div class="res" onclick="openReport('+r.row+')"><div><b>'+esc(r.name)+'</b> <span class="sub">· '+esc(r.id)+'</span>'+
      '<div class="sub">'+esc(r.ward)+' · by '+esc(r.zcrim)+' · '+esc(r.ts)+'</div></div>'+
      '<span class="pill '+(/^resurvey/i.test(r.tag)?'p-orange':'p-gray')+'">'+esc(r.tag)+'</span></div>';
  }).join('');
}
function openReport(row){
  document.getElementById('results').innerHTML='';
  document.getElementById('report').innerHTML='<div class="msg">Building report… (loading photos)</div>';
  google.script.run.withSuccessHandler(render).withFailureHandler(fail).rv2Report(row);
}
function fail(e){ document.getElementById('report').innerHTML='<div class="msg" style="color:var(--red)">'+esc(e && e.message || e)+'</div>'; }

// ── Report ──
function render(d){
  var s=d.survey, M=d.members, P=d.photos, flags=[];
  function flag(level,text){ flags.push([level,text]); }

  // Evidence
  var missing = PHOTOS.filter(function(p){ return p[2] && !P[p[0]]; }).map(function(p){ return p[1]; });
  var taken = PHOTOS.filter(function(p){ return P[p[0]]; }).length;
  var hasGps = present(s.GPS_Lat) && s.GPS_Lat!=='N/A';
  if (missing.length) flag('red','Missing required photo: <b>'+esc(missing.join(', '))+'</b>');
  if (!hasGps) flag('red','No GPS location recorded for this survey');

  // Photo spread
  var pts=[]; Object.keys(P).forEach(function(k){ var la=parseFloat(P[k].lat), lo=parseFloat(P[k].lng); if(!isNaN(la)&&!isNaN(lo)) pts.push([la,lo]); });
  var spread=0; pts.forEach(function(a){ pts.forEach(function(b){ spread=Math.max(spread, km(a,b)); }); });
  if (pts.length>1 && spread>150) flag('orange','Photos taken up to <b>'+Math.round(spread)+' m</b> apart');

  // Assets — 8 indicators
  var A = [
    ['Pucca house',      s.HouseCondition==='Pucca',             s.HouseCondition, false],
    ['Two wheeler',      present(s.TwoWheeler),                  s.TwoWheeler,     true],
    ['Four wheeler',     present(s.FourWheeler),                 s.FourWheeler,    true],
    ['Agriculture land', present(s.AgriLand),                    s.AgriLand,       true],
    ['Other land',       present(s.OtherLand),                   s.OtherLand,      true],
    ['Shop / business',  /^yes$/i.test(s.ShopBusiness),          s.ShopBusiness,   true],
    ['Tax payer',        /^yes$/i.test(s.TaxPayer),              s.TaxPayer,       true],
    ['Cattle / buffalo', parseFloat(s.Cattle)>0,                 s.Cattle,         true]
  ];
  var aCount = A.filter(function(a){ return a[1]; }).length;
  A.forEach(function(a){ if(a[1] && a[3]) flag('orange', a[0]+': <b>'+esc(a[2])+'</b>'); });

  // Members & income
  var lo=0, ranged=0, earning=0, declared=0, hasDeclared=false;
  M.forEach(function(m){
    var r=range(m.income);
    if(r){ lo+=r[0]; ranged++; if(r[1]==null || r[1]>5000) earning++; }
    if(present(m.declared)){ var dv=+String(m.declared).replace(/[^\d.]/g,''); declared+=dv; hasDeclared=true;
      if(r && (dv<r[0] || (r[1]!=null && dv>r[1]))) flag('orange', esc(m.name)+': declared '+inr(dv)+' is outside chosen range ₹'+esc(m.income)); }
  });
  var head = M[0];
  if (head && present(s.Age) && present(head.age) && String(+head.age)!==String(+s.Age))
    flag('orange','Head\'s age differs: PPP <b>'+esc(s.Age)+'</b>, survey <b>'+esc(head.age)+'</b>');
  if (!M.length) flag('red','No family members recorded');
  var dur = +s.DurationSec || 0;
  if (dur>0 && dur<180) flag('orange','Survey took only <b>'+Math.round(dur/60)+' min</b>');

  // Positive checks last
  if (!missing.length) flag('green','Selfie and all required photos on file');
  if (hasGps) flag('green','GPS location captured');
  if (pts.length>1 && spread<=150) flag('green','All photos taken within '+Math.max(10,Math.round(spread))+' m of each other');

  var reds=flags.filter(function(f){return f[0]==='red';}).length, oranges=flags.filter(function(f){return f[0]==='orange';}).length;
  var status = reds ? ['p-red','● Incomplete'] : oranges ? ['p-orange','● Needs review'] : ['p-green','● Verified'];
  var resurvey = /^resurvey/i.test(s.SurveyTag);
  var famBracket = ranged ? familyBracket(lo) : '';
  var incomeTxt = ranged ? '₹'+famBracket.replace(' - ','–') : '—';
  var gender = s.Gender==='M'?'Male':s.Gender==='F'?'Female':s.Gender;
  var mapUrl = hasGps ? 'https://maps.google.com/?q='+encodeURIComponent(s.GPS_Lat+','+s.GPS_Lng) : '';
  function v(x){ return String(x||'').trim() ? esc(x) : '<span style="color:var(--label3)">—</span>'; }
  function yes(x, warn){ return warn ? '<span class="pill p-orange" style="padding:2px 8px">'+esc(x)+'</span>' : v(x); }

  var html =
  '<div class="page">'+
  '<div class="hero"><div>'+
    '<div class="eyebrow">Family Verification · '+esc(s.Ward)+', '+esc(s.Block)+'</div>'+
    '<h1>'+esc(s.FamilyName)+'</h1>'+
    '<div class="meta">'+esc(s.FamilyID)+' &nbsp;·&nbsp; '+esc(s.Age)+', '+esc(gender)+(present(s.FamilyMobile)?' &nbsp;·&nbsp; '+esc(s.FamilyMobile):'')+'<br>'+esc(s.Address)+'</div>'+
  '</div><div class="right">'+
    '<span class="pill '+status[0]+'">'+status[1]+'</span>'+(resurvey?' <span class="pill p-orange">'+esc(s.SurveyTag)+'</span>':'')+
    '<div class="small" style="margin-top:10px">Surveyed '+esc(s.Timestamp)+'<br>by '+esc(s.ZCRIMName)+(present(s.ZCRIMMobile)?' · '+esc(s.ZCRIMMobile):'')+
      '<br>'+(resurvey?'Re-survey':'Original survey')+(dur?' · '+Math.floor(dur/60)+' min '+(dur%60)+' s':'')+'</div>'+
  '</div></div>'+

  '<div class="stats">'+
    '<div class="stat"><div class="s">Members</div><div class="n">'+M.length+'</div><div class="s">'+earning+' earning</div></div>'+
    '<div class="stat"><div class="s">Family income</div><div class="n" style="color:var(--blue);font-size:'+(incomeTxt.length>14?17:21)+'px">'+incomeTxt+'</div><div class="s">'+(ranged?'sum of lowest '+inr(lo):'no income entered')+(hasDeclared?' · declared '+inr(declared):'')+'</div></div>'+
    '<div class="stat"><div class="s">Asset indicators</div><div class="n" style="color:'+(aCount>2?'var(--orange)':'var(--label)')+'">'+aCount+'<small> / 8</small></div><div class="s">'+
      (A.filter(function(a){return a[1];}).map(function(a){return a[0].toLowerCase();}).slice(0,2).join(', ')||'none')+'</div></div>'+
    '<div class="stat"><div class="s">Evidence</div><div class="n" style="color:'+(missing.length?'var(--red)':'var(--green)')+'">'+taken+'<small> / 6</small></div><div class="s">photos'+(hasGps?' + GPS':'')+'</div></div>'+
  '</div>'+

  '<div class="card"><h2>At a glance</h2><div class="glance">'+
    flags.map(function(f){ return '<div class="flag"><span class="dot" style="background:var(--'+f[0]+')"></span>'+f[1]+'</div>'; }).join('')+
  '</div></div>'+

  '<div class="card"><h2>Photo evidence</h2><div class="photos">'+
    PHOTOS.map(function(p){
      var ph=P[p[0]];
      var img = !ph ? '<div class="img miss'+(p[2]?' req':'')+'">'+(p[2]?'Missing (required)':'Not captured (optional)')+'</div>'
              : ph.src ? '<a href="'+esc(ph.url)+'"><div class="img" style="background-image:url('+ph.src+')"></div></a>'
              : '<a href="'+esc(ph.url)+'"><div class="img">Open in Drive ›</div></a>';
      var gps = ph && present(ph.lat) && ph.lat!=='N/A' ? esc(ph.lat)+', '+esc(ph.lng) : (ph?'No GPS':'');
      return '<div class="ph">'+img+'<div class="c">'+p[1]+'</div><div class="m">'+gps+'</div></div>';
    }).join('')+
  '</div>'+(mapUrl?'<div class="small" style="margin-top:10px">Survey location '+esc(s.GPS_Lat)+', '+esc(s.GPS_Lng)+' · <a href="'+mapUrl+'">Open in Maps ›</a></div>':'')+'</div>'+

  '<div class="two"><div class="card"><h2>Household</h2><table class="list">'+
    '<tr><td class="k">House</td><td class="v">'+v(s.HouseCondition)+(present(s.HouseSize)?' · '+esc(s.HouseSize)+' sq yd':'')+'</td></tr>'+
    '<tr><td class="k">On rent</td><td class="v">'+v(s.HouseRent)+(/^yes$/i.test(s.HouseRent)&&present(s.RentAmt)?' · ₹'+esc(s.RentAmt)+'/month':'')+'</td></tr>'+
    '<tr><td class="k">Electricity</td><td class="v">'+v(s.Electricity)+'</td></tr>'+
    '<tr><td class="k">Property ID</td><td class="v">'+v(s.PropertyID)+'</td></tr>'+
    '<tr><td class="k">Split from parents</td><td class="v">'+v(s.SplitFamily)+'</td></tr>'+
    '<tr><td class="k">Tax payer</td><td class="v">'+yes(s.TaxPayer, A[6][1])+'</td></tr>'+
  '</table></div>'+
  '<div class="card"><h2>Assets</h2><div class="meter"><div style="width:'+(aCount/8*100)+'%"></div></div><table class="list">'+
    '<tr><td class="k">Two wheeler</td><td class="v">'+yes(s.TwoWheeler, A[1][1])+'</td></tr>'+
    '<tr><td class="k">Four wheeler</td><td class="v">'+yes(s.FourWheeler, A[2][1])+'</td></tr>'+
    '<tr><td class="k">Agriculture land</td><td class="v">'+yes(s.AgriLand, A[3][1])+'</td></tr>'+
    '<tr><td class="k">Other land</td><td class="v">'+yes(s.OtherLand, A[4][1])+'</td></tr>'+
    '<tr><td class="k">Shop / business</td><td class="v">'+yes(s.ShopBusiness, A[5][1])+'</td></tr>'+
    '<tr><td class="k">Cattle / buffalo</td><td class="v">'+yes(s.Cattle, A[7][1])+'</td></tr>'+
  '</table></div></div>'+

  '<div class="keep"><div class="card"><h2>Members</h2>'+(M.length ? '<table class="mem"><tr><th>Name</th><th>Age</th><th>Occupation</th><th class="r">Income range (₹)</th>'+(hasDeclared?'<th class="r">Declared</th>':'')+'</tr>'+
    M.map(function(m){
      return '<tr><td><span class="av">'+esc(initials(m.name))+'</span><b>'+esc(m.name)+'</b>'+(present(m.remarks)?' <span class="sub">· '+esc(m.remarks)+'</span>':'')+'</td>'+
        '<td>'+v(m.age)+'</td><td>'+v(m.occupation)+'</td><td class="r">'+v(m.income)+'</td>'+
        (hasDeclared?'<td class="r">'+(present(m.declared)?inr(+String(m.declared).replace(/[^\d.]/g,'')):v(''))+'</td>':'')+'</tr>';
    }).join('')+
    (ranged?'<tr><td colspan="3"><b>Family income</b> <span class="sub">· lowest of each range added: '+inr(lo)+'</span></td><td class="r"><b>'+esc(famBracket)+'</b></td>'+(hasDeclared?'<td class="r"><b>'+inr(declared)+'</b></td>':'')+'</tr>':'')+
    '</table>' : '<div class="sub">No members recorded.</div>')+'</div>'+

  '<div class="sign"><div>Surveyor: '+esc(s.ZCRIMName)+'</div><div>Verifying officer</div><div>Decision &nbsp; ☐ Approve &nbsp; ☐ Reject &nbsp; ☐ Re-survey</div></div>'+
  '<div class="foot">ZCRIM Survey · '+esc(s.FamilyID)+' · '+esc(s.SurveyTag||'Original')+' · Generated '+esc(d.generated)+' · Income is self-declared</div>'+
  '</div></div>';

  document.getElementById('report').innerHTML = html;
  document.getElementById('btn-print').disabled = false;
  document.title = s.FamilyID+' '+s.FamilyName+' – Family Report';   // default PDF file name
}

search();
</script>
</body>
</html>
